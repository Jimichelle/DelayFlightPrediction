[project]
name = "flight-delays-hdfs"
version = "0.1.0"
description = "Retards de vols US 2015 : HDFS (Docker) -> PySpark -> Streamlit"
readme = "README.md"
# PySpark 3.5 (imposé par le cours, compatible Java 11) n'est pas fiable avec Python 3.12+
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==4.3.0",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "jupyter",
    "matplotlib",
    "streamlit",
    "pandas-stubs==3.1.0.261029",
    "tensorflow>=2.21.0",
    "xgboost>=3.2.0",
]
